<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>SwissEph WASI Browser Parity Test</title>
    <style>
      body {
        font-family: monospace;
        padding: 20px;
        background: #222;
        color: #ddd;
      }
      .pass {
        color: #4ec9b0;
      }
      .fail {
        color: #f44747;
      }
      pre {
        background: #111;
        padding: 10px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <h1>Browser Parity Test</h1>
    <div id="output">Running...</div>
    <pre id="log"></pre>

    <script type="module">
      import { SwissEph } from "./dist/main.js";
      import { Constants } from "./dist/api.js";
      import { runE2ETests } from "./dist/e2e_suite.js";

      const logEl = document.getElementById("log");
      function log(msg, cls) {
        const div = document.createElement("div");
        if (cls) div.className = cls;
        div.textContent = msg;
        logEl.appendChild(div);
        console.log("BROWSER:", msg);
      }

      async function run() {
        try {
          // 1. Load WASM Module
          log("Loading WASM module...");
          const wasmUrl = "../../../lib/wasi/swiss_eph.wasm";
          const wasmResp = await fetch(wasmUrl);
          const wasmBytes = await wasmResp.arrayBuffer();
          const module = await WebAssembly.compile(wasmBytes);

          // 2. Instantiate SwissEph
          log("Instantiating SwissEph...");
          const eph = new SwissEph(module);
          log("✓ SwissEph instantiated. Version: " + eph.swe_version());

          // 3. Mount Ephemeris
          const epheFiles = [
            "sepl_18.se1",
            "semo_18.se1",
            "seas_18.se1",
          ];
          log("Mounting ephemeris files...");
          for (const file of epheFiles) {
            try {
              const resp = await fetch(
                `../../../vendor/swisseph/ephe/${file}`,
              );
              if (!resp.ok) {
                throw new Error("Fetch failed: " + resp.status);
              }
              const bytes = await resp.arrayBuffer();
              eph.mount(file, new Uint8Array(bytes));
              log(`  ✓ Mounted ${file}`);
            } catch (e) {
              log(`  ! Error mounting ${file}: ${e.message}`, "fail");
            }
          }
          eph.set_ephe_path("./");

          // 4. Run Unified Suite
          log("\nStarting Unified E2E Suite...");
          const report = runE2ETests(eph, Constants, "Browser (WASI)");

          if (report.failed > 0) {
            document.getElementById("output").textContent = "FAIL";
            log(`\nFAILED: ${report.failed} tests failed.`, "fail");
          } else {
            document.getElementById("output").textContent = "PASS";
            log(
              `\nSUCCESS: All ${report.passed} tests passed.`,
              "pass",
            );
          }
        } catch (err) {
          log("CRITICAL ERROR: " + err.message, "fail");
          document.getElementById("output").textContent = "ERROR: " +
            err.message;
        }
      }

      run();
    </script>
  </body>
</html>
