<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>SwissEph WASI Browser Artifact Test</title>
    <style>
      body {
        font-family: monospace;
        padding: 20px;
        background: #222;
        color: #ddd;
      }
      .pass {
        color: #4ec9b0;
      }
      .fail {
        color: #f44747;
      }
    </style>
  </head>
  <body>
    <h1>Browser Artifact Test</h1>
    <div id="output">Running...</div>
    <pre id="log"></pre>

    <script type="module">
      // Import from the bundled artifact generated by tests/e2e/browser/build.ts
      import { Constants, createSwissEph } from "./dist/test_bundle.js";

      const logEl = document.getElementById("log");
      function log(msg, cls) {
        logEl.textContent += (cls ? `[${cls.toUpperCase()}] ` : "") +
          msg + "\n";
        console.log("BROWSER:", msg);
      }

      async function run() {
        try {
          // The browser wrapper provides a factory function that handles
          // WASM decoding and compilation automatically.
          const eph = createSwissEph();

          log("SwissEph instance created.");

          // Test Calculation (Moshier Mode)
          const jd = 2461054.5;

          const iflag = Constants.SEFLG_MOSEPH |
            Constants.SEFLG_TRUEPOS | Constants.SEFLG_NOABERR |
            Constants.SEFLG_NONUT;
          // Golden value for Sun (High Precision)
          const EXPECTED_SUN_LON = 293.81730274152;

          // Log Constants to verify import
          log(`Constants.SE_SUN: ${Constants.SE_SUN}`);
          log(`Constants.SE_MOON: ${Constants.SE_MOON}`);
          log(`Constants.SE_VENUS: ${Constants.SE_VENUS}`);

          // 1. Basic WASM Check
          const ver = eph.swe_version();
          log(`SwissEph Version: ${ver}`);

          if (!ver) {
            throw new Error("swe_version returned empty string");
          }

          // 2. Julian Day Check
          const jdCalc = eph.swe_julday(
            2026,
            1,
            14,
            12.0,
            Constants.SE_GREG_CAL,
          );
          log(`JulDay (2026-01-14 12:00): ${jdCalc}`);

          const { xx } = eph.swe_calc(jd, Constants.SE_SUN, iflag);
          const diff = Math.abs(xx[0] - EXPECTED_SUN_LON);

          log(`Sun Longitude (swe_calc): ${xx[0]}`);
          log(`Diff from Golden: ${diff.toExponential(2)}`);

          // Moshier mode should be within 1e-4 of high-precision value
          if (diff < 1e-4) {
            document.getElementById("output").textContent = "PASS";
            log("Verification Successful (Moshier Precision)", "pass");
          } else {
            document.getElementById("output").textContent = "FAIL";
            log(`Precision Check Failed. Diff: ${diff}`, "fail");
          }
        } catch (e) {
          document.getElementById("output").textContent = "ERROR: " +
            e.message;
          log(e.message, "fail");
        }
      }

      run();
    </script>
  </body>
</html>
