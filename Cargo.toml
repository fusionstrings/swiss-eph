[package]
name = "swiss-eph"
version = "0.1.1"
edition = "2021"
authors = ["fusionstrings"]
description = "Complete FFI bindings to the Swiss Ephemeris astronomical calculation library"
license = "AGPL-3.0"
repository = "https://github.com/fusionstrings/swiss-eph"
documentation = "https://docs.rs/swiss-eph"
keywords = ["astronomy", "ephemeris", "astrology", "planetary", "calculation"]
categories = ["science", "api-bindings"]
readme = "README.md"
links = "swisseph"
exclude = [
    # Ephemeris data and binaries
    "vendor/swisseph/ephe",
    "vendor/swisseph/doc",
    "vendor/swisseph/windows",
    "vendor/swisseph/contrib",
    "vendor/swisseph/test",
    "vendor/swisseph/bin",
    "vendor/swisseph/swetest",
    "vendor/swisseph/setest",
    "vendor/swisseph/swein600.jpg",
    # Build tooling
    "toolchain",
    "npm",
    "lib",
    "scripts",
    ".github",
    ".vscode",
    "swetest_enhanced",
    "swetest_enhanced.wasm",
    "bench_native",
    "tests",
    "artifacts",
    "bindings",
    # Deno/TypeScript files
    "deno.json",
    "deno.lock",
    "src/*.ts",
    "src/generated",
    "skills",
    "Makefile",
    "crate",
]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.106"

[build-dependencies]
cc = "1.2.53"

[features]
default = []
