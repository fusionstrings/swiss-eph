name: CI

on:
  push:
    branches: [creation]
  pull_request:
    branches: [creation]

env:
  DENO_VERSION: v2.x
  WASI_SDK_VERSION: "24"

jobs:
  # Main build and test job
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Git Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: ${{ env.DENO_VERSION }}


      - name: Setup WASI SDK
        run: |
          wget -q https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${{ env.WASI_SDK_VERSION }}/wasi-sdk-${{ env.WASI_SDK_VERSION }}.0-x86_64-linux.tar.gz
          tar xf wasi-sdk-${{ env.WASI_SDK_VERSION }}.0-x86_64-linux.tar.gz
          mkdir -p toolchain
          mv wasi-sdk-${{ env.WASI_SDK_VERSION }}.0-x86_64-linux toolchain/wasi-sdk-${{ env.WASI_SDK_VERSION }}.0

      - name: Create output directories
        run: mkdir -p lib/wasi lib/wasm-sdk lib/wasm-sdk-inline

      - name: Setup Toolchain (Symlinks & SDK)
        run: deno task setup

      - name: Generate API bindings
        run: deno run -A scripts/codegen.ts

      - name: Build Legacy WASI (make)
        run: deno task build:wasm

      - name: Build wasmbuild artifacts
        run: |
          deno task build:wasmbuild
          deno task build:wasmbuild:inline

      - name: Build Native swetest
        run: |
          cd vendor/swisseph
          make swetest

      - name: Verify Golden Values
        run: deno task verify:golden

      - name: Lint
        run: deno lint

      - name: Run Tests
        run: deno task test

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "latest"

      - name: Run Node.js E2E Tests
        run: deno task test:node

      - name: Dry-run JSR Publish
        run: deno publish --dry-run

      - name: Upload WASM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-artifacts
          path: |
            lib/wasi/
            lib/wasm-sdk/
            lib/wasm-sdk-inline/


  # Rust crate build and test
  rust-build:
    name: Rust Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Git Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Create vendor symlink
        run: |
          mkdir -p vendor
          ln -s ../crates/swiss-eph/vendor/swisseph vendor/swisseph

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Rust Crate
        run: cargo build --release

      - name: Run Rust Tests
        run: cargo test --manifest-path crates/swiss-eph/Cargo.toml -- --test-threads=1
        env:
          RUST_BACKTRACE: 1

      - name: Dry-run Cargo Publish
        run: cd crates/swiss-eph && cargo publish --dry-run
