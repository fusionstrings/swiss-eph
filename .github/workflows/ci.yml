name: CI

on:
  push:
    branches: [creation]
  pull_request:
    branches: [creation]
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Git Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Setup WASI SDK
        run: |
          wget https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-24/wasi-sdk-24.0-x86_64-linux.tar.gz
          tar xvf wasi-sdk-24.0-x86_64-linux.tar.gz
          mkdir -p toolchain
          mv wasi-sdk-24.0-x86_64-linux toolchain/wasi-sdk-24.0

      - name: Build WASM
        run: deno task build:wasm

      - name: Run Tests
        run: deno task test

      - name: Build NPM Package
        run: |
          deno task build:browser
          deno task build:npm

      - name: Build Browser Artifacts
        run: echo "Browser artifacts built in previous step"

      - name: Verify Node.js Support
        run: deno task test:node

      - name: Check Browser Artifacts
        run: |
          test -f browser/wrapper.ts

      - name: Upload NPM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: npm/

      - name: Upload Browser Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: browser-artifact
          path: browser/

      - name: Upload WASM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-binary
          path: libswephe.wasm

  publish:
    name: Publish
    if: github.event_name == 'release' && github.event.action == 'created'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Git Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Download NPM Artifacts
        uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: npm/

      - name: Download Browser Artifacts
        uses: actions/download-artifact@v4
        with:
          name: browser-artifact
          path: browser/

      - name: Download WASM Artifact
        uses: actions/download-artifact@v4
        with:
          name: wasm-binary
          path: .

      - name: Check Version Consistency
        run: deno task check-version

      - name: Publish to JSR
        run: deno publish

      - name: Publish to NPM
        run: |
          cd npm
          npm config set //registry.npmjs.org/:_authToken ${{ secrets.NPM_TOKEN }}
          npm publish --access public
