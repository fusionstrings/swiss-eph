name: CI

on:
  push:
    branches: [creation]
  pull_request:
    branches: [creation]
  release:
    types: [created]

env:
  DENO_VERSION: v2.x
  WASI_SDK_VERSION: "24"

jobs:
  # Main build and test job
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Git Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: latest

      - name: Setup WASI SDK
        run: |
          wget -q https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${{ env.WASI_SDK_VERSION }}/wasi-sdk-${{ env.WASI_SDK_VERSION }}.0-x86_64-linux.tar.gz
          tar xf wasi-sdk-${{ env.WASI_SDK_VERSION }}.0-x86_64-linux.tar.gz
          mkdir -p toolchain
          mv wasi-sdk-${{ env.WASI_SDK_VERSION }}.0-x86_64-linux toolchain/wasi-sdk-${{ env.WASI_SDK_VERSION }}.0

      - name: Create output directories
        run: mkdir -p lib/wasi lib/wasm-sdk lib/wasm-sdk-inline

      - name: Generate API bindings
        run: deno run -A scripts/codegen.ts

      - name: Build Legacy WASI (make)
        run: deno task build:wasm

      - name: Build wasmbuild artifacts
        run: |
          deno task build:wasmbuild
          deno task build:wasmbuild:inline

      - name: Build Native swetest
        run: |
          cd vendor/swisseph
          make swetest

      - name: Verify Golden Values
        run: deno task verify:golden

      - name: Lint
        run: deno lint

      - name: Run Tests
        run: deno task test


      - name: Build NPM Package
        run: deno task build:npm

      - name: Verify Node.js Support
        run: deno task test:node

      - name: Dry-run JSR Publish
        run: deno publish --dry-run

      - name: Upload WASM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-artifacts
          path: |
            lib/wasi/
            lib/wasm-sdk/
            lib/wasm-sdk-inline/

      - name: Upload NPM Package
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: npm/

  # Rust crate build and test
  rust-build:
    name: Rust Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Git Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Rust Crate
        run: cargo build --release

      - name: Run Rust Tests
        run: cargo test --test swetest_comparison -- --test-threads=1
        env:
          RUST_BACKTRACE: 1

      - name: Dry-run Cargo Publish
        run: cargo publish --dry-run

  # Publish job (only on release)
  publish:
    name: Publish
    if: github.event_name == 'release' && github.event.action == 'created'
    runs-on: ubuntu-latest
    needs: [build, rust-build]
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Git Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup WASI SDK
        run: |
          wget -q https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${{ env.WASI_SDK_VERSION }}/wasi-sdk-${{ env.WASI_SDK_VERSION }}.0-x86_64-linux.tar.gz
          tar xf wasi-sdk-${{ env.WASI_SDK_VERSION }}.0-x86_64-linux.tar.gz
          mkdir -p toolchain
          mv wasi-sdk-${{ env.WASI_SDK_VERSION }}.0-x86_64-linux toolchain/wasi-sdk-${{ env.WASI_SDK_VERSION }}.0

      - name: Create output directories
        run: mkdir -p lib/wasi lib/wasm-sdk lib/wasm-sdk-inline

      - name: Generate API bindings
        run: deno run -A scripts/codegen.ts

      - name: Build all artifacts
        run: |
          deno task build:wasm
          deno task build:wasmbuild
          deno task build:wasmbuild:inline
          deno task build:npm

      - name: Check Version Consistency
        run: deno run -A scripts/check_version.ts

      - name: Publish to JSR
        run: deno publish

      - name: Publish to NPM
        run: |
          cd npm
          npm config set //registry.npmjs.org/:_authToken ${{ secrets.NPM_TOKEN }}
          npm publish --access public

      - name: Publish to crates.io
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
