name: Release

on:
  release:
    types: [created]

env:
  DENO_VERSION: v2.x
  WASI_SDK_VERSION: "24"

jobs:
  publish-jsr:
    name: Publish to JSR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: ${{ env.DENO_VERSION }}
      
      - name: Setup WASI SDK
        run: |
          wget -q https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${{ env.WASI_SDK_VERSION }}/wasi-sdk-${{ env.WASI_SDK_VERSION }}.0-x86_64-linux.tar.gz
          tar xf wasi-sdk-${{ env.WASI_SDK_VERSION }}.0-x86_64-linux.tar.gz
          mkdir -p toolchain
          mv wasi-sdk-${{ env.WASI_SDK_VERSION }}.0-x86_64-linux toolchain/wasi-sdk-${{ env.WASI_SDK_VERSION }}.0

      - name: Create output directories
        run: mkdir -p lib/wasi lib/wasm-sdk lib/wasm-sdk-inline

      - name: Setup Toolchain (Symlinks & SDK)
        run: deno task setup

      - name: Generate API bindings
        run: deno run -A scripts/codegen.ts

      - name: Build all artifacts
        run: |
          deno task build:wasm
          deno task build:wasmbuild
          deno task build:wasmbuild:inline

      - name: Pre-flight Validation (Lint & Tests)
        run: |
          deno lint
          deno task build:swetest
          deno task test
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "latest"

      - name: Run Node.js E2E Tests
        run: deno task test:node

      - name: Dry-run JSR Publish
        run: deno publish --dry-run
      
      - name: Check Version Consistency
        run: deno run -A scripts/check_version.ts

      - name: Publish to JSR
        run: deno publish

  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Create vendor symlink
        run: |
          mkdir -p vendor
          ln -s ../crates/swiss-eph/vendor/swisseph vendor/swisseph
      
      - name: Pre-flight Rust Validation
        run: |
          cargo test --manifest-path crates/swiss-eph/Cargo.toml -- --test-threads=1
          cd crates/swiss-eph && cargo publish --dry-run
          cd ../swiss-eph-data && cargo publish --dry-run
      
      - name: Publish swiss-eph-data
        run: cargo publish --manifest-path crates/swiss-eph-data/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        continue-on-error: true
      
      - name: Wait for crates.io index
        run: sleep 30
      
      - name: Publish swiss-eph
        run: cargo publish --manifest-path crates/swiss-eph/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
