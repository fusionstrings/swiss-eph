name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  publish-jsr:
    name: Publish to JSR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      
      - name: Lint & Test
        run: |
          deno lint
          deno task test
      
      - name: Publish to JSR
        run: deno publish

  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: publish-jsr  # JSR first, then crates
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup Rust
        uses: dtolnay/rust-action@stable
      
      - name: Run Rust tests
        run: cargo test --manifest-path crates/swiss-eph/Cargo.toml
      
      # Publish swiss-eph-data first (if version changed)
      - name: Publish swiss-eph-data
        run: cargo publish --manifest-path crates/swiss-eph-data/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        continue-on-error: true  # Skip if already published
      
      - name: Wait for crates.io index
        run: sleep 30
      
      # Publish swiss-eph
      - name: Publish swiss-eph
        run: cargo publish --manifest-path crates/swiss-eph/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
